name: Build Ice Analyzer VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\wv2 | Out-Null
          Invoke-WebRequest -Uri https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.1901.177 -OutFile C:\wv2\webview2.zip
          Expand-Archive -Path C:\wv2\webview2.zip -DestinationPath C:\wv2\Microsoft.Web.WebView2.1.0.1901.177 -Force
          Get-ChildItem C:\wv2\Microsoft.Web.WebView2.1.0.1901.177\build\native

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION=C:/wv2

      - name: Build
        run: cmake --build build --config Release --target IceAnalyzer_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: IceAnalyzer-VST3-Windows
          path: build/IceAnalyzer_artefacts/Release/VST3/
